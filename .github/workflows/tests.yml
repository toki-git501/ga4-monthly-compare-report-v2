name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pdfplumber

      - name: テスト実行
        run: pytest tests/ -q

      - name: フィクスチャに実クライアント名が混入していないか検査
        run: |
          if grep -rlE 'クララス|長久手|本山|藤が丘|千種区' tests/fixtures/; then
            echo "::error::フィクスチャにクライアントを特定できる文字列が含まれています"
            exit 1
          fi
          echo "OK: 固有名詞なし"
